<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TON Mining</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>⛏ TON Mining</h1>
            <p id="userName">Salom!</p>
        </header>

        <section class="balance-card">
            <p>💰 Balans</p>
            <h2 id="balance">0.0000 TON</h2>
        </section>

        <section class="mining-card">

            <div class="mining-icon">⛏️</div>

            <h2>Mining</h2>

            <p id="miningStatus">
                Mining faol emas
            </p>

            <p id="timer">
                24:00:00
            </p>

            <button id="startMining">
                ▶️ START MINING
            </button>

        </section>

        <div class="menu">

            <button>🎁 Kunlik bonus</button>

            <button>👥 Referal</button>

            <button>📋 Vazifalar</button>

            <button>💎 TON Wallet</button>

            <button>🚀 Boost</button>

            <button>👑 VIP</button>

            <button>🛒 Do‘kon</button>

            <button>🧮 Kalkulyator</button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
              </html>
